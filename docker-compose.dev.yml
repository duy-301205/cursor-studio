name: custom-cursor-dev

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in root .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cursor_studio}
      MYSQL_USER: ${MYSQL_USER:-cursor_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in root .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: development
    environment:
      APP_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${MYSQL_DATABASE:-cursor_studio}
      DATABASE_USER: ${MYSQL_USER:-cursor_app}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:?set in root .env}
      PUBLIC_API_BASE_URL: http://localhost:8000
      PUBLIC_FRONTEND_BASE_URL: http://localhost:5173
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_BACKEND: local
      AUTO_SEED: "${AUTO_SEED:-true}"
      ADMIN_AUTH_ENABLED: "${ADMIN_AUTH_ENABLED:-false}"
      ADMIN_ANI_UPLOAD_ENABLED: "${ADMIN_ANI_UPLOAD_ENABLED:-false}"
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:5173}
      ADMIN_ALLOW_LOOPBACK_HTTP: "${ADMIN_ALLOW_LOOPBACK_HTTP:-false}"
      ADMIN_CSRF_KEY: ${ADMIN_CSRF_KEY:-}
      ADMIN_DRAFT_THUMBNAIL_URL: ${ADMIN_DRAFT_THUMBNAIL_URL:-}
      ADMIN_ASSET_LOCAL_ROOT: /var/lib/cursor-studio/admin-assets
      USER_AUTH_ENABLED: "${USER_AUTH_ENABLED:-false}"
      USER_FEATURE_AUTH_REQUIRED: "${USER_FEATURE_AUTH_REQUIRED:-false}"
      USER_ORIGIN: ${USER_ORIGIN:-http://localhost:5173}
      USER_ALLOW_LOOPBACK_HTTP: "${USER_ALLOW_LOOPBACK_HTTP:-false}"
      USER_CSRF_KEY: ${USER_CSRF_KEY:-}
    volumes:
      - ./backend:/app
      - admin_dev_assets:/var/lib/cursor-studio/admin-assets
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_dev_data:
  admin_dev_assets:
